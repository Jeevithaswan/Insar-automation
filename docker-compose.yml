# Usage:
#   docker compose run --rm insar tracks configs/runs/dummy_test_aoi.yaml
#   docker compose run --rm insar 0
#   docker compose run --rm insar 1
#   docker compose run --rm insar 7 36.10022 -119.44996
#   ...same stage numbers/args as running pipeline.py directly.
#
# Credentials (~/.netrc, ~/.cdsapirc) are mounted read-only from your own
# home directory -- never baked into the image, never committed to the repo.

services:
  insar:
    build: .
    image: insar-pipeline
    volumes:
      - ${HOME}/.netrc:/root/.netrc:ro
      - ${HOME}/.cdsapirc:/root/.cdsapirc:ro
      - ./runs:/root/insar-automation/runs
      - ./configs:/root/insar-automation/configs
