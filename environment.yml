# Exact package versions verified working in this project's live testing on
# 2026-08-04 (all 9 pipeline.py stages run end-to-end against these).
# Trimmed from an earlier version: dropped streamlit/pydantic/folium, which
# were for the old dashboard -- pipeline.py itself doesn't need them. Add
# them back if/when dashboard work resumes.
name: insar
channels:
  - conda-forge
dependencies:
  - python=3.12.13
  - isce2=2.6.5
  - mintpy=1.6.4
  - gdal=3.10.3
  - h5py=3.16.0
  - pyaps3=0.3.7      # only exercised if mintpy.tropo_enabled=true in a config
  - cdsapi=0.7.7       # ditto -- needs ~/.cdsapirc if actually used
  - asf_search=12.2.3
  - pyyaml=6.0.3
  - pip
  - pip:
    - dem_stitcher==2.5.13
    - rasterio==1.5.0
    - sentineleof==0.13.0
